name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_HIREBUDDHA_VOICE_WSS: wss://api.fluidbuddha.com
      - run: npx playwright install --with-deps chromium
      - name: Smoke test
        run: |
          npx next start -p 3100 &
          npx wait-on -t 60000 http://localhost:3100
          npm run smoke
        env:
          BASE_URL: http://localhost:3100
